<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2007" height="4196" viewBox="0 0 2007 4196">
  <!-- Tiling pattern built from the Indigo Interiors mark (Indigo-mark.svg).

       HALF DROP. The tile is one mark wide and two marks tall: the first
       row sits centred, the second is shifted half a tile across, so when
       the tile repeats the rows alternate and the marks read as a
       checkerboard rather than a straight grid. The shifted row straddles
       the tile edge, so it is drawn twice (once off each side); the two
       clipped halves meet seamlessly in the neighbouring tile.

       Cell is 2007 x 2098 for a 1006.75 x 1097.71 mark, so roughly half of
       each cell is empty and the marks stay spaced. Because the tile is
       still one cell wide, background-size keeps its meaning: the CSS
       value is the width of one cell, unchanged by the half drop.

       Drawn in white; the faintness comes from the opacity set by the
       patterned-section rule in css/style.css. Keep this geometry at full
       strength so spacing and colour stay separate controls.

       NOTE: strict XML. No non-ASCII characters, and no double hyphen
       anywhere inside a comment (that includes BEM-style class names). -->
  <defs>
    <g id="mark">
      <!-- arch -->
      <path d="M903.54,370.87C903.54,206.58,770.91,73.64,607,73.64S310.46,206.58,310.46,370.87"
            transform="translate(-103.63 -42.64)"
            fill="none" stroke="#ffffff" stroke-miterlimit="10" stroke-width="62"/>
      <!-- fanlight: the sunburst window inside the arch -->
      <path d="M602.59,370.86H811.3c0-112.83-91.47-204.3-204.3-204.3S402.7,258,402.7,370.86H602.26l.08.15Zm-74.21-146,5.38-20.08a192.78,192.78,0,0,1,53.71-13.17L602.78,207v99.28a64.23,64.23,0,0,0-23.84,6.22Zm157.68-.1-50.7,87.81a64.28,64.28,0,0,0-23.58-6.33V206.45l14.79-14.79A192.59,192.59,0,0,1,680.76,205ZM669.31,353.19a64,64,0,0,0-4.18-10.91l91.54-52.85,17.39,4.66a148.69,148.69,0,0,1,12.24,59.1Zm87.79-88.9-4.6,17.15L660.6,334.5a65.1,65.1,0,0,0-17.44-17.38l50.74-87.89,21.2-5.68A171,171,0,0,1,757.1,264.29ZM499,223.46l21.44,5.74,50.66,87.74a65,65,0,0,0-17.67,17.47L462,281.61l-4.77-17.79A171.11,171.11,0,0,1,499,223.46Zm-59.15,70.77,17.74-4.76,91.3,52.71a64.08,64.08,0,0,0-4.23,11h-117A148.73,148.73,0,0,1,439.88,294.23Z"
            transform="translate(-103.63 -42.64)" fill="#ffffff"/>
      <!-- left pillar + door -->
      <polygon points="237.83 354.99 237.83 1097.71 0 1097.71 0 1086.24 140.82 1086.24 140.82 366.46 0 366.46 0 354.99 237.83 354.99" fill="#ffffff"/>
      <polygon points="401.61 441.7 273.61 369.71 273.61 725.72 273.61 1081.71 401.61 1009.73 400.12 725.72 401.61 441.7" fill="#ffffff"/>
      <!-- right pillar + door -->
      <polygon points="768.92 354.99 768.92 1097.71 1006.75 1097.71 1006.75 1086.24 865.93 1086.24 865.93 366.46 1006.75 366.46 1006.75 354.99 768.92 354.99" fill="#ffffff"/>
      <polygon points="605.14 441.7 733.14 369.71 733.14 725.72 733.14 1081.71 605.14 1009.73 606.63 725.72 605.14 441.7" fill="#ffffff"/>
      <!-- centre seam -->
      <rect x="498.87" y="354.99" width="9" height="612.1" fill="#ffffff"/>
      <!-- door handles -->
      <rect x="363.07" y="763.72" width="14.67" height="65.33" fill="#ffffff"/>
      <rect x="732.64" y="806.37" width="14.67" height="65.33" transform="translate(1376.31 1635.43) rotate(-180)" fill="#ffffff"/>
    </g>
  </defs>

  <!-- row 1: centred in the upper cell -->
  <use href="#mark" x="500" y="500"/>
  <!-- row 2: same cell position, shifted half a tile (1003.5) across and
       drawn off both edges so the halves rejoin across the tile seam -->
  <use href="#mark" x="1503.5" y="2598"/>
  <use href="#mark" x="-503.5" y="2598"/>
</svg>
